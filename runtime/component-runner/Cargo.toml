[package]
name = "logicpilot-component-runner"
version = "0.1.0"
edition = "2021"
description = "Wasmtime Component Model runner for LogicPilot WIT plugins"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = "48.0.1", features = ["component-model"] }

