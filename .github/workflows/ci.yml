name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: kernel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-msvc-dev
          - os: ubuntu-latest
            preset: linux-clang-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '39344dff01c5a5a0134caf2624cdd492f05d30ea'

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          ninja-version: latest

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: CMake configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}

      - name: CMake build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (ctest)
        run: ctest --preset ${{ matrix.preset }} || ctest --test-dir build/${{ matrix.preset }} --output-on-failure

  web:
    name: web (pnpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Build
        # Web packages are scaffolded in a later phase; this job validates the
        # workspace wiring and stays green while the frontend is empty.
        run: pnpm build
