name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: kernel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-msvc-dev
          - os: ubuntu-latest
            preset: linux-clang-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Schema conform gate (F1 ir_v2.fbs / F2 wire.fbs)
        # Validates schemas/{ir,wire}.fbs against schemas/baseline/ via
        # flatc --conform + binary-schema diff (scripts/check-schema-conform.ps1).
        # Must run before any build step; contract drift fails fast.
        shell: pwsh
        run: scripts/check-schema-conform.ps1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '39344dff01c5a5a0134caf2624cdd492f05d30ea'

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Setup Node (schema interop verifier)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5 auto-caching detects the root packageManager (pnpm) and needs
          # pnpm on PATH; this job installs no packages, so opt out.
          package-manager-cache: false

      - name: CMake configure
        run: cmake --preset ${{ matrix.preset }}

      - name: CMake build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (ctest)
        run: ctest --preset ${{ matrix.preset }} || ctest --test-dir build/${{ matrix.preset }} --output-on-failure

      - name: Schema interop (F1/F2 C++ <-> TS runtime)
        # Runs after the C++ build: scripts/run-schema-interop.ps1 builds the
        # standalone C++ writer (scripts/interop), emits model_file.bin +
        # counters_frame.bin, and verifies both with the TypeScript runtime
        # (web/packages/protocol/test/verify-interop.mjs). This is the only CI
        # gate that proves the C++ and TS encoders agree at runtime, not just
        # that the .fbs schemas stay conformant.
        shell: pwsh
        run: scripts/run-schema-interop.ps1

  web:
    name: web (pnpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # Frozen-lockfile only: a drifted pnpm-lock.yaml must fail CI instead of
        # being silently rewritten by the fallback install.
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        # renderer2d vitest cases are the TS-side regression defense for the F2
        # wire contract; @logicpilot/protocol's verify-interop needs the C++
        # schema_interop_writer artifacts and therefore runs in the kernel job.
        run: pnpm test

      - name: Docs build (VitePress user manual)
        # The user manual lives in docs/ and is built with VitePress; a broken
        # page or markdown error must fail CI instead of shipping.
        run: pnpm docs:build

  bench:
    name: bench (perf gates)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Schema conform gate (F1 ir_v2.fbs / F2 wire.fbs)
        shell: pwsh
        run: scripts/check-schema-conform.ps1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '39344dff01c5a5a0134caf2624cdd492f05d30ea'

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master

      - name: Install clang (Linux)
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: CMake configure (release + benchmarks)
        # Release build: the perf baseline asserts >= 1M events/s and only
        # holds with optimizations on (docs/performance-budget.md #1/#2).
        run: cmake --preset linux-clang-release -DLOGICPILOT_BUILD_BENCH=ON

      - name: CMake build
        run: cmake --build --preset linux-clang-release

      - name: Perf baseline (>= 1M events/s)
        run: ctest --test-dir build/linux-clang-release -R "1M events" --output-on-failure

      - name: Benchmark smoke (scheduler / RNG / MM1 event loop)
        # Builds and runs the google/benchmark gates briefly; the hard
        # thresholds live in test_perf_baseline above, this step only proves
        # the bench targets stay buildable and runnable in CI.
        run: |
          ./build/linux-clang-release/kernel/logicpilot_bench --benchmark_min_time=0.2s
          ./build/linux-clang-release/kernel/mm1_event_bench --benchmark_min_time=0.2s
          ./build/linux-clang-release/kernel/process_flow_bench --benchmark_min_time=0.2s

  dsl-grammar:
    name: dsl grammar (tree-sitter corpus)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # v5 auto-caching detects the root packageManager (pnpm) and needs
          # pnpm on PATH; this job installs via npm, so opt out.
          package-manager-cache: false

      - name: Install tree-sitter CLI
        working-directory: dsl/tree-sitter-logicpilot
        run: npm ci --no-audit --no-fund

      - name: Generated parser is in sync with grammar.js
        # Audit gate (P0): a grammar.js change must regenerate parser.c and
        # friends in the same change. tree-sitter generate is deterministic
        # for the locked CLI (0.26.11), so any diff here is real drift; the
        # untracked check catches brand-new generated files as well.
        working-directory: dsl/tree-sitter-logicpilot
        run: |
          npm run generate
          git diff --exit-code -- src/
          test -z "$(git ls-files --others --exclude-standard)" || \
            { echo "tree-sitter generate produced untracked files"; exit 1; }

      - name: Run corpus tests
        # tree-sitter test exercises test/corpus/*.txt against the checked-in
        # parser.c; a grammar regression fails CI instead of being caught only
        # indirectly by the C++ DSL tests.
        working-directory: dsl/tree-sitter-logicpilot
        run: npm test
